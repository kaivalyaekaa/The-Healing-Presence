spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healingpresence?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:thp_app}
    password: ${DB_PASS:}
  jpa:
    # Phase 2 rebuild: Flyway stripped. Hibernate owns schema in dev; in prod
    # operators should pin JPA_DDL_AUTO=validate and run schema migrations
    # manually until Flyway is re-introduced (see REBUILD.md at branch root).
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: Asia/Kolkata
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

google:
  calendar:
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://thehealingpresence.in/admin/google-calendar/callback}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  forward-headers-strategy: native      # honour X-Forwarded-* from Caddy
  error:
    whitelabel:
      enabled: false

logging:
  level:
    com.healingpresence: INFO
    org.springframework: WARN
    org.hibernate: WARN
