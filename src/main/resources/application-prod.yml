spring:
  datasource:
    # URL is provider-agnostic — Render injects a Postgres URL, Oracle Cloud
    # / Aiven inject a MySQL URL. Spring Boot + HikariCP auto-pick the driver
    # from the URL prefix (jdbc:postgresql:// vs jdbc:mysql://) so both work
    # from the same image without code changes.
    url: ${DB_URL:jdbc:mysql://localhost:3306/healingpresence?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USER:thp_app}
    password: ${DB_PASS:}
  jpa:
    # Phase 2 rebuild: Flyway stripped. In prod operators should pin
    # JPA_DDL_AUTO=validate once the schema settles and run SQL migrations
    # manually (or reintroduce Flyway — see REBUILD.md at repo root).
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: false
    # Hibernate dialect auto-detected from the JDBC URL — no explicit setting.
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

google:
  calendar:
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://thehealingpresence.in/admin/google-calendar/callback}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  forward-headers-strategy: native      # honour X-Forwarded-* from Caddy
  error:
    whitelabel:
      enabled: false

logging:
  level:
    in.thehealingpresence: INFO
    org.springframework: WARN
    org.hibernate: WARN
