# =====================================================================
# The Healing Presence — application.properties
# ---------------------------------------------------------------------
# Spring Boot reads both application.properties (this file) AND
# application.yml. Where the same key is defined in both, .properties
# wins (Spring Boot's property-source ordering).
#
# Most multi-section configuration (mail, JPA, Google Calendar OAuth,
# app.admin credentials) lives in application.yml because YAML is
# easier to read when keys nest. This file holds the small handful of
# top-level overrides that benefit from .properties form (e.g. quick
# environment-style tweaks, or external runtime override via
# `--spring.config.location=…/application.properties`).
# =====================================================================

# Application name surfaced in the actuator / startup banner.
spring.application.name=healing-presence

# Default server port — set SERVER_PORT env var to override in prod.
server.port=${SERVER_PORT:8080}

# Tomcat session cookie — secure-by-default-on-https handled in
# application-prod.yml; this is the dev fallback.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
