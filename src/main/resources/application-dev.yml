spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healingpresence?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate:
      ddl-auto: update       # Hibernate creates/updates schema from entities (Flyway stripped in Phase 2 rebuild)
    defer-datasource-initialization: true   # run data.sql after Hibernate creates tables
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always           # seed via data.sql on every boot (idempotent via DELETE+INSERT)
  devtools:
    restart:
      enabled: true
