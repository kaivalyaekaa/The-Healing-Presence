spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healingpresence?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate just validates it matches
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never            # Flyway is the only schema/data initialiser now
  devtools:
    restart:
      enabled: true
